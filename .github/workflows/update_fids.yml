name: Update data

on:
  schedule:
    - cron: "12 7 * * *"
  workflow_dispatch:

jobs:
  update:
    name: update data
    runs-on: ubuntu-node
    steps:
      - name: Clone repo
        run: |
          git clone --depth 1 -b main http://git.repodata.economiayfinanzas.gob.bo/mefp-uie/vuelos.git .
      - name: install python and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r update/requirements.txt
      - name: run update script
        env:
          CKAN_URL: http://ckan:5000
          CKAN_ACCESS_KEY: ${{ secrets.CKAN_ACCESS_KEY }}
          S3_ENDPOINT: http://aistor:9000
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: |
          python update/fetch_fids_naabol.py
