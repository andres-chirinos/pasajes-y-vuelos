name: Update pasajes data

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  update:
    name: update pasajes data
    runs-on: ubuntu-node
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.20"
      - name: install python and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r update/requirements.txt
      - name: run update script
        env:
          CKAN_URL: http://ckan:5000
          CKAN_ACCESS_KEY: ${{ secrets.CKAN_ACCESS_KEY }}
          S3_ENDPOINT: http://aistor:9000
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: |
          python update/fetch_pasajes.py


